# render.yaml — EğitimÜssü Render.com IaC
# Doküman: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: egitimussu-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free          # Ücretsiz plan: 15 dk. hareketsizlikte uyur
    port: 8080
    healthCheckPath: /health/live

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # PostgreSQL — Render managed DB'den otomatik alınır
      - key: ConnectionStrings__Postgres
        fromDatabase:
          name: egitimussu-db
          property: connectionString

      # Redis — Render'da ücretsiz Redis yok; Upstash Redis kullanın.
      # https://upstash.com → Redis oluştur → "Endpoint:Port" kopyala
      # Render dashboard'da bu değeri elle girin: redis://<user>:<pass>@<host>:<port>
      - key: Redis__Configuration
        sync: false

      - key: Jwt__Issuer
        value: EgitimUssu
      - key: Jwt__Audience
        value: EgitimUssu.Clients
      - key: Jwt__ExpiryMinutes
        value: "60"
      - key: Jwt__SigningKey
        generateValue: true   # Render otomatik güvenli bir değer üretir

      # P15 T6 / N-24, P-01: Sağlayıcılar üretimde AÇIKÇA tanımlıdır. Anahtar boş kalırsa
      # appsettings.json varsayılanı (Logging e-posta / Local depolama) devreye girer ve
      # EmailOptionsGuard / StorageOptionsGuard açılışı DURDURUR (Logging e-posta şifre sıfırlama
      # kodlarını log'a yazar; Local depolama konteynerin geçici diskine yazar).
      # Q7 (SMTP) ve Q4 (S3/R2) cevaplanmadan üretim servisi açılmaz — bilinçli.
      # Değerler Render panelinden girilir (sync: false). Ayrıntı: doc/architecture/environments.md §1
      - key: Email__Provider
        sync: false           # "Smtp"
      - key: Email__FromEmail
        sync: false           # ör. no-reply@<alan-adi> (Q14)
      - key: Email__Smtp__Host
        sync: false
      # Email__Smtp__Port tanimli degil: varsayilan 587 (STARTTLS). Farkli port gerekirse
      # panelden SAYI olarak eklenir — bos bir tamsayi anahtari yapilandirma baglamasini bozar.
      - key: Email__Smtp__Username
        sync: false
      - key: Email__Smtp__Password
        sync: false

      - key: Storage__Provider
        sync: false           # "S3"
      - key: Storage__BucketName
        sync: false
      - key: Storage__ServiceUrl
        sync: false           # R2/MinIO icin uc nokta; AWS S3'te bos
      - key: Storage__AccessKeyId
        sync: false
      - key: Storage__SecretAccessKey
        sync: false

      # Push uretimde Logging ile acilabilir (yuk sir tasimaz; Firebase Q8 beklenirken yayin
      # yapilabilsin) — acilista uyari loglanir. Q8 cevaplaninca: Fcm + Push__ProjectId +
      # Push__ServiceAccountJson (sync: false).
      - key: Push__Provider
        value: Logging

      # E-05: Üretimde migration AÇILIŞTA UYGULANMAZ. Şema değişikliği ayrı ve gözetilen bir
      # deploy adımıdır (doc/architecture/backup_restore.md §4). Bu değer yanlışlıkla "true"
      # yapılsa bile MigrationStartupGuard uygulamaz; burada "false" olması, uyarı log'u
      # üretmemesi ve niyetin blueprint'ten okunabilmesi içindir.
      - key: Database__ApplyMigrationsOnStartup
        value: "false"

      - key: Outbox__DispatchEnabled
        value: "true"
      - key: Outbox__BatchSize
        value: "20"
      - key: Outbox__PollIntervalSeconds
        value: "15"

      # C-04 / K-10: Gozlemlenebilirlik (OpenTelemetry). Anahtarlar burada TANIMLI ama
      # "Enabled" bilerek "false": OtlpEndpoint bos birakilirsa kod konsol exporter'a duser
      # ve her SQL komutu servis log'una akar (Render stdout'u ucretsiz planda bogar).
      # Bir toplayici (Grafana Cloud / Honeycomb / self-hosted otelcol) secilince:
      #   1) OtlpEndpoint'i Render panelinden gir  2) Enabled -> "true"
      # Ayrinti: doc/architecture/environments.md §Gozlemlenebilirlik
      - key: Observability__Enabled
        value: "false"
      - key: Observability__OtlpEndpoint
        sync: false
      - key: Observability__ServiceName
        value: egitimussu-api

  # ---------------------------------------------------------------------------
  # E-06: Staging — üretimin provasi. Ayri servis, AYRI VERITABANI.
  # Uretim verisine hicbir bicimde dokunmaz; demo veri yalniz burada tohumlanir.
  # Detay: doc/architecture/environments.md
  # ---------------------------------------------------------------------------
  - type: web
    name: egitimussu-api-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    port: 8080
    healthCheckPath: /health/live

    envVars:
      # Staging, Production DEGILDIR: DemoDataSeedGuard yalnizca bu sayede tohumlamaya izin verir.
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging

      # Ayri veritabani — staging'i sifirlamak uretimi etkilemesin.
      - key: ConnectionStrings__Postgres
        fromDatabase:
          name: egitimussu-staging-db
          property: connectionString

      - key: Redis__Configuration
        sync: false

      - key: Jwt__Issuer
        value: EgitimUssu
      - key: Jwt__Audience
        value: EgitimUssu.Clients
      - key: Jwt__ExpiryMinutes
        value: "60"
      # Uretimden AYRI anahtar: staging token'i uretimde gecerli olmamali.
      - key: Jwt__SigningKey
        generateValue: true

      - key: Database__ApplyMigrationsOnStartup
        value: "true"

      # Demo veri: idempotent, her acilista yalniz eksikleri tamamlar.
      - key: Seeding__Enabled
        value: "true"

      # Gercek e-posta/push GONDERILMEZ — demo hesaplarin adresleri gercek degil, gonderim
      # denemeleri hem bounce uretir hem sagayici itibarini yakar.
      - key: Email__Provider
        value: Logging
      - key: Email__FromEmail
        value: no-reply@egitimussu.local
      - key: Push__Provider
        value: Logging

      - key: Outbox__DispatchEnabled
        value: "true"
      - key: Outbox__BatchSize
        value: "20"
      - key: Outbox__PollIntervalSeconds
        value: "15"

      # C-04 / K-10: Gozlemlenebilirlik. Uretimden AYRI servis adi — trace'ler karismasin.
      # Acma yordami ve varsayilanin neden "false" oldugu icin uretim servisindeki nota bakin.
      - key: Observability__Enabled
        value: "false"
      - key: Observability__OtlpEndpoint
        sync: false
      - key: Observability__ServiceName
        value: egitimussu-api-staging

databases:
  - name: egitimussu-db
    plan: free            # 90 gün sonra sona erer; ücretli plana geçebilirsiniz
    databaseName: egitimussu
    user: egitimussu_user

  - name: egitimussu-staging-db
    plan: free
    databaseName: egitimussu_staging
    user: egitimussu_staging_user
